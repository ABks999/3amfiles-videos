name: Render Short
on:
  workflow_dispatch:
  push:
    paths: ['renderer/story.py', 'renderer/episode.txt', '.github/workflows/render.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install -q kokoro-onnx soundfile numpy pillow
      - name: Download voice model
        working-directory: renderer
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Render
        working-directory: renderer
        run: |
          python3 tts.py
          python3 render.py
          bash mix.sh
      - name: Commit video
        run: |
          git config user.name "3am-bot"
          git config user.email "3am-bot@users.noreply.github.com"
          git add videos/*.mp4
          git commit -m "Render episode $(cat renderer/episode.txt)" || echo "nothing to commit"
          git pull --rebase
          git push
